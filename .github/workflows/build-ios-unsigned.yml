name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-unsigned.yml'
      - 'iosApp/**'
      - 'composeApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel all older iOS runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$REPO/actions/runs?per_page=100")"

          mapfile -t stale_ids < <(jq -r --argjson current "$CURRENT_RUN_ID" '
            .workflow_runs[]
            | select(.path == ".github/workflows/build-ios-unsigned.yml")
            | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")
            | select(.id != $current)
            | .id
          ' <<<"$runs")

          if [ "${#stale_ids[@]}" -eq 0 ]; then
            echo 'No stale iOS runs to cancel.'
            exit 0
          fi

          for run_id in "${stale_ids[@]}"; do
            echo "Cancelling stale iOS run: $run_id"
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$REPO/actions/runs/$run_id/cancel" || true
          done

  build-ios:
    needs: cleanup
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout TextLector
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          cat > local.properties <<'EOF'
          KEYSTORE_PASSWORD=ci-placeholder
          KEY_PASSWORD=ci-placeholder
          EOF

      - name: Run shared TTS tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :composeApp:jvmTest

      - name: Cache sherpa-onnx iOS frameworks
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: iosApp/Frameworks
          key: sherpa-onnx-ios-v1.12.34-macos15-v2

      - name: Build sherpa-onnx XCFrameworks
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          brew install wget ninja || true
          rm -rf /tmp/sherpa-onnx
          git clone --depth 1 --branch v1.12.34 https://github.com/k2-fsa/sherpa-onnx.git /tmp/sherpa-onnx
          cd /tmp/sherpa-onnx
          ./build-ios.sh

          SHERPA_XC="$(find /tmp/sherpa-onnx -type d -name 'sherpa-onnx.xcframework' -print -quit)"
          ORT_XC="$(find /tmp/sherpa-onnx -type d -name 'onnxruntime.xcframework' -print -quit)"
          echo "sherpa-onnx XCFramework: $SHERPA_XC"
          echo "onnxruntime XCFramework: $ORT_XC"
          test -n "$SHERPA_XC"
          test -n "$ORT_XC"

          cd "$GITHUB_WORKSPACE"
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/sherpa-onnx.xcframework iosApp/Frameworks/onnxruntime.xcframework
          cp -R "$SHERPA_XC" iosApp/Frameworks/sherpa-onnx.xcframework
          cp -R "$ORT_XC" iosApp/Frameworks/onnxruntime.xcframework

      - name: Verify native frameworks
        shell: bash
        run: |
          set -euxo pipefail
          test -d iosApp/Frameworks/sherpa-onnx.xcframework
          test -d iosApp/Frameworks/onnxruntime.xcframework
          find iosApp/Frameworks -maxdepth 3 -type f | sed -n '1,80p'

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Bundle Supertonic resources
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          rm -rf /tmp/supertonic-kmp
          git clone --depth 1 https://github.com/nedmah/supertonic-kmp.git /tmp/supertonic-kmp

          RESOURCE_DIR="/tmp/supertonic-kmp/core/src/commonMain/resources/supertonic"
          if [ ! -d "$RESOURCE_DIR" ]; then
            RESOURCE_DIR="$(find /tmp/supertonic-kmp -type d -path '*/composeResources/files/supertonic' -print -quit || true)"
          fi

          test -n "$RESOURCE_DIR"
          test -d "$RESOURCE_DIR"
          test -f "$RESOURCE_DIR/voice_styles/M1.json"
          test -f "$RESOURCE_DIR/voice_styles/F1.json"

          rm -rf "$APP_PATH/supertonic"
          cp -R "$RESOURCE_DIR" "$APP_PATH/supertonic"

          test -f "$APP_PATH/supertonic/voice_styles/M1.json"
          test -f "$APP_PATH/supertonic/voice_styles/F1.json"
          echo "Bundled Supertonic resources from $RESOURCE_DIR"
          find "$APP_PATH/supertonic/voice_styles" -maxdepth 1 -type f -name '*.json' -print

      - name: Bundle Russian pronunciation dictionaries
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          DEST="$APP_PATH/pronunciation/ru"
          mkdir -p "$DEST"

          BASE='https://huggingface.co/ruaccent/accentuator/resolve/153c03b8429853c850b1b2c50f57dd28a3c864e7/dictionary'

          fetch_dictionary() {
            name="$1"
            expected_sha="$2"
            archive="/tmp/${name}.json.gz"
            output="$DEST/${name}.json"

            curl -L --fail --retry 3 --retry-delay 2 "$BASE/${name}.json.gz" -o "$archive"
            echo "$expected_sha  $archive" | shasum -a 256 -c -
            gzip -dc "$archive" > "$output"
            test -s "$output"
          }

          fetch_dictionary accents_nn 8395664000b80c1afe09bfea3650945b0933482b8e3dee5bb9d429eb18c44935
          fetch_dictionary omographs 04a9e81c68d65f65ba493fe0110f99e79087548c2beeec3032e2b66e28706f36
          fetch_dictionary yo_words a19fa89a964a0691d9fe4ee384783e3934904891843d8f59a1c480d67947a82a
          fetch_dictionary yo_homographs c4ee777bbbab87f9eac838f370ad92974e079d02b21903e480c54b5f0c8c60d1

          echo 'Bundled Russian pronunciation dictionaries:'
          ls -lh "$DEST"

      - name: Bundle RUAccent tiny2.1 homograph model
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          DEST="$APP_PATH/pronunciation/ru/homograph/tiny2.1"
          mkdir -p "$DEST"
          BASE='https://huggingface.co/ruaccent/accentuator/resolve/c3970fdf3e3b4b6baeb0b42f38a411abb2b4adfb/nn/nn_omograph/tiny2.1'

          for name in model.onnx vocab.txt added_tokens.json tokenizer_config.json config.json special_tokens_map.json tokenizer.json; do
            curl -L --fail --retry 3 --retry-delay 2 "$BASE/$name" -o "$DEST/$name"
            test -s "$DEST/$name"
          done

          echo '2f60ac3391b6ac2500792dc9125414c95767b6b3c49adb8472b7ab6574fe84e8' " $DEST/model.onnx" | shasum -a 256 -c -
          echo 'Bundled RUAccent tiny2.1:'
          ls -lh "$DEST"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload TextLector-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry TextLector-unsigned.ipa Payload
          unzip -l TextLector-unsigned.ipa | sed -n '1,180p'
          unzip -l TextLector-unsigned.ipa | grep -E 'supertonic/voice_styles/(M1|F1)\.json'
          unzip -l TextLector-unsigned.ipa | grep -E 'pronunciation/ru/(accents_nn|omographs|yo_words|yo_homographs)\.json'
          unzip -l TextLector-unsigned.ipa | grep -E 'pronunciation/ru/homograph/tiny2\.1/(model\.onnx|vocab\.txt|added_tokens\.json|tokenizer_config\.json)'
          if codesign -dv "$APP_PATH" >/dev/null 2>&1; then
            echo 'WARNING: app bundle contains a code signature.'
          else
            echo 'Confirmed: app bundle is unsigned.'
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TextLector-unsigned
          path: TextLector-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
